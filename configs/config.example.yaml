#   conda activate antsreg
#   ./run_pipeline.sh configs/mouse01.yaml

sample:
  name: mouse01                     # 样本标识，会用作输出文件名前缀

  raw_tiff: /path/to/downsampled_stack.tif
  voxel_size_um: [2.6, 2.6, 32.0]    # 顺序是 [x, y, z]，单位微米——每个样本自己实际的降采样体素尺寸

  # 【可选】样本在处理过程中裂开、有组织掰开移位时，用这份 plan 在配准【之前】把
  # 它们刚性地合回去。plan 由 Registration_toolkit/paint_mask.py 的 Reposition
  # 面板导出（guide 和 labels 两个模式里都有），文件名是 <导出文件名>.reposition.json，
  # 旁边的 <导出文件名>_fragments.nii.gz 记录着碎片轮廓（plan 里的 labels_path 指向它）。
  # 碎片轮廓【不用手画】：掰开的那几层里碎片本来就是独立连通块，在面板里点
  # "Grab this plane" 再点碎片就能抠出来。一次一层，z 范围就是你点过的那些层，
  # 层间在应用 plan 时自动填充（densify_fragments）。
  #
  # 只需要这一行：raw_tiff、guide_regions.regions_mask、sample_damage_mask_path、
  # cells.cell_centroids_dir 会【一起】被搬，因为它们都画/测在同一个原始网格上，
  # 分开搬就会互相错位。config 仍然指向【原始】文件，不用维护一份复位后的副本。
  #
  # 变换模型是逐 z 层的面内刚体（平移 + 面内旋转 + 整层的 z 位移），不含面外旋转
  # ——各向异性 2.6/2.6/32 的数据支撑不起那个自由度。细节见
  # src/registration_ants/reposition.py 的模块 docstring。
  #
  # 细胞 CSV 的第 0-2 列保持【原始】坐标（那是细胞在磁盘数据里的真实位置），
  # 第 3-8 列和脑区归属按复位后的位置算（配准跑的就是复位后的网格）。
  #
  # 想看复位后的图长什么样，或者需要把结果反向搬回原始几何做 QC：
  #   python scripts/apply_reposition.py <plan.json> --output-dir <dir> [--invert]
  # reposition_plan: /path/to/s18_regions.reposition.json

  # if the sample has multiple channels, you can specify them here. 
  #   - name: signal_channel1
  #     raw_tiff: /path/to/signal_channel1.tif
  #     voxel_size_um: [2.6, 2.6, 32.0]

cells:
  cell_centroids_dir: /path/to/cell_centroids   
  prefix: "ob_"                                  
  voxel_size_um: [0.65, 0.65, 8.0]   

atlas:
  source: devccf_p04

atlas_variants:
  demba_p5:
    output_dir: /path/to/output/mouse01/DeMBA
    fine_target_um: 25
    atlas_res_um: 25
  devccf_p04:
    output_dir: /path/to/output/mouse01/DevCCF
    fine_target_um: 20
    atlas_res_um: 20

    # 把图谱的轴转成跟【本样本】一致。取决于样本的成像方位，换方位就要重推 ——
    # 完整推导步骤见 configs/atlas_presets.example.yaml 顶部的「怎么推 orientation」。
    # 下面这个值对应"轴0=左→右, 轴1=前→后, 轴2=上→下"的 horizontal plane 样本。
    orientation: [1, -3, 2]

    # 只有半个脑的样本，图谱也要裁成同一侧（否则 SyN 会去硬拉伸匹配不存在的另一半，
    # 又慢又配不准）。索引是【转向之后】网格上的（slicing 在 orientation 之后生效）。
    # DevCCF P04 转向后 X 轴 = 左→右共 640 体素，中线在 320：
    #   右半球 [[320, 640], null, null] / 左半球 [[0, 320], null, null] / 全脑：整行删掉
    # slicing: [[320, 640], null, null]

    # 【半脑样本几乎必配】给裁好的图谱四周补零背景，保证组织和数组的六个面之间
    # 至少隔这么多个空体素。padding 在 orientation + slicing 【之后】生效，
    # 语义是"补到至少这么宽"而不是"再加这么多"——已经够宽的面不动，重复跑不会
    # 越补越大。
    #
    # 为什么必须有：ANTs/ITK 的 SyN 把形变场在 fixed（图谱）网格的【六个面上
    # 强制为精确的 0】。实测一次真实跑的 1Warp.nii.gz 和 1InverseWarp.nii.gz，
    # 六个面的 max|位移| 全部是 0.000000，而内部中位数是 110µm。这意味着
    # 【贴着面的组织根本动不了】——这是加在形变场上的约束，不是目标函数里的一项，
    # 所以换 metric、加迭代、加 guide_regions 引导项、把权重调到多大都没有用。
    #
    # 而按中线裁半脑，正好把整个内侧切面（实测 105259 个组织体素）放在了这个
    # 被钉死的面上：不管样本的中线多偏斜，图谱中线永远笔直不动，内部却在正常
    # 形变——这个现象非常好认。合成幻影验证：pad=0 时切面位移恒为 0.000、
    # 倾斜量永远是 0；pad>=5 就跳到均值 41µm、倾斜量精确复现真值，
    # atlas→sample 的 Dice 0.982 → 1.000。
    #
    # 注意【不要】改成"把 slicing 放宽、把多出来的对侧组织 mask 掉"：内侧面那个
    # 组织/背景的强度台阶正是 metric 唯一能咬住的边，放进真实对侧组织就把这个台阶
    # 抹掉了。补零是把被钉死的面挪开、同时把台阶原样留下。
    #
    # 取值：幻影里 5 就够，20 是留了 4 倍余量的稳妥值（20µm 分辨率下 = 0.4mm）。
    # 代价是体积变大：216x582x353 -> 246x602x373，约 +24% 显存和时间。
    background_margin_voxels: 20

registration:
  type_of_transform: SyNRA    # 单次配准的变换类型：Rigid+Affine+SyN 一体

  # 【可选】手动 landmark 生成的初始形变场 —— 参数调不动的情况才用：样本形变
  # 到强度 metric 根本建立不起对应关系时（组织扭曲、结构边界在样本里看不出来）。
  # 两个文件由 Registration_toolkit/fit_initial_transform.py 从两份 landmark
  # CSV（样本侧+图谱侧，同一批位置同一顺序）生成。
  # 给了之后：跳过自动的 Translation 预对齐，Affine/SyN 从这个形变场接着优化。
  # inverse_path 【必填】不是可选 —— ANTs 无法给外部传入的形变场求逆，缺了它
  # 所有 atlas→sample 的产物（labels_in_sample、细胞脑区分配）会静默算错而不报错。
  # initial_transform:
  #   path: /path/to/transforms/tsc12t_landmark_init_fwd.nii.gz
  #   inverse_path: /path/to/transforms/tsc12t_landmark_init_inv.nii.gz

  # SyN 阶段 CC 相似度的【邻域半径】，单位是体素（不是直方图 bin 数——antspyx
  # 的 syn_sampling 一个参数两种含义，默认值 32 是给 mattes 的 bin 数，当成
  # CC 半径用就是 65^3 个体素的窗口，局部结构全被平均掉、SyN 只剩全局位移，
  # 而且每次迭代要几十秒到几分钟）。4 是 antsRegistrationSyN.sh 的官方默认。
  # 太小（1）会因为窗内样本太少而被噪声带偏，2~4 是实践区间。
  syn_sampling: 4

  # SyN 每个分辨率层级的最大迭代次数，从最粗到最细；列表【长度】同时决定金字塔
  # 层数（3 项 = 4倍降采样 / 2倍 / 全分辨率）。这是上限不是固定开销——某层
  # 收敛值跌破 1e-7 就会提前退出。antspyx 默认 (40,20,0) 的最后一项是 0，
  # 意味着全分辨率层一次都不跑（形变场只在 2 倍降采样上估计再上采样），
  # 对形变量大的样本明显不够。
  reg_iterations: [100, 70, 50]

  # 配准前把样本图像四周多余的空白 buffer 裁掉——数值是【原始 TIFF 自己的】
  # 体素序号（x=列, y=行, z=第几张切片，顺序跟 sample.voxel_size_um 一致），
  # 直接在 ImageJ/Fiji 等工具里打开原始 raw_tiff 读出组织实际范围就行，不用
  # 先跑流水线、不用换算到 fine_target_um 网格。裁剪发生在重采样【之前】。
  crop_for_registration:
    x: [50, 400]
    y: null
    z: [10, 200]

mask:
  # atlas_exclude_regions: ["Olfactory bulb"]
  atlas_exclude_regions: []

  # 【可选】区域引导：主动把样本上某几块组织拉去和图谱对应区域重合。跟上面的
  # exclude 相反 —— exclude 是"这块别管了"，guide 是"这块给我拉过去"。用于
  # 组织确实存在、但形变大到强度 metric 找不到对应关系的地方。
  #
  # 【只画样本侧】：图谱侧按名字从标注文件自动抠出来，不用画第二遍。
  # regions_mask 是 Registration_toolkit/paint_mask.py（kind=guide）画出的
  # 多 label 文件 —— 一个文件里若干脑区，用不同画笔数字区分。
  # guide_regions:
  #   regions_mask: /path/to/s12t_regions.nii.gz
  #   # 必填：在原始 TIFF 上画的 mask，文件头里【没有】体素尺寸（读回来是
  #   # 1,1,1），必须在这里显式给，顺序同 sample.voxel_size_um。
  #   voxel_size_um: [2.6, 2.6, 32.0]
  #   # 画笔 label -> 图谱区域名。子串匹配、大小写不敏感、子结构自动包含、
  #   # 多个名字取并集（DevCCF 没有单一的 "cortex"，只有 36 个分层，所以
  #   # 必须这样并起来）。一个名字都匹配不到会【直接报错】，不会静默跳过。
  #   atlas_names:
  #     1: ["layer 1 of", "layer 2 of", "layer 3 of",
  #         "layer 4 of", "layer 5 of", "layer 6 of"]   # cortex
  #     2: ["cerebellar hemisphere", "cerebellar vermis"]
  #     3: ["corpus callosum"]
  #   weight: 1.0        # 单值，或 {1: 1.0, 2: 0.5} 按 label 分别给
  #
  #   # 【atlas_ids/atlas_names 都可以整个不写】：某个 label 在这两个字典里都
  #   # 没有的话，会自动去 regions_mask 旁边同名的 <stem>.regions.json 里按
  #   # label 读 region_ids —— 那是 paint_mask.py 画完导出时自动写的，记录的
  #   # 是画那个 label 时在 GUI 本体树里【实际选中】的 id。好处是不用再手抄
  #   # 一份 atlas_ids 到这份 config 里、并在每次重画/改选之后手动保持同步
  #   # （手抄这件事本身就是问题的来源：改画之后配置文件很容易忘记跟着改，
  #   # 而且不会报错——两边都能通过校验，只是配的和实际画的对不上）。
  #   # 如果某个 label 在这里显式给了 atlas_ids，会优先用这份、不看 sidecar，
  #   # 但如果两者不一致，运行时会打一条 WARNING 提醒（可能是忘了同步，也
  #   # 可能是故意手动纠正 GUI 选错的节点）。
  #
  #   # 【可选】atlas_ids/atlas_names 是按子结构【全部并入】展开的（同一个
  #   # label 下可以并多个），并不支持"减去"某个子结构 —— 但本体里子结构常常
  #   # 互相包含，比如 DevCCF 的 olfactory bulb 就是 pallium 的后代。如果
  #   # pallium 画成 label 1、又想单独给形变严重的嗅球开一个 label（比如
  #   # label 6）单独引导，label 1 的图谱侧会【自动】把嗅球的体素也包含
  #   # 进去 —— 这样同一批图谱体素同时被两个 guide pair 拉向不同的样本
  #   # 目标（粗糙的 pallium 轮廓 vs 精细的嗅球轮廓），是冲突/冗余的引导项，
  #   # 而不是真正的分层。样本侧画的时候不用管这个：napari 的 Labels 层是
  #   # 单值光栅，后画的嗅球 label 自然把该区域从 pallium 的 label 里挖空。
  #   # 用 atlas_exclude_ids 从某个 label 的图谱侧减掉指定结构（含其后代），
  #   # key 必须是 atlas_ids/atlas_names/regions_mask 的 sidecar 三者之一
  #   # 配过的 label（哪怕 atlas_ids/atlas_names 都没写、完全靠 sidecar 也算）：
  #   atlas_exclude_ids:
  #     1: [15905]   # 把 label 1 (pallium) 的图谱轮廓里减掉 olfactory bulb
  #
  #   # 【可选】damage_labels：把某几个画笔 label 解释成"样本上存在、但图谱里
  #   # 【没有对应物】的组织"——不参与 guide pair，而是并进 moving_mask 把这些
  #   # 体素从 metric 里挖掉，语义同下面的 sample_damage_mask_path。典型用途：
  #   # 半脑样本局部切过了中线，多出的对侧薄片在半球图谱里没有对应物。
  #   # 好处是和 guide 区域在同一次 paint_mask.py 会话里画（每个 label 独立做
  #   # 关键帧插值，薄片只需画几层），不用单独维护一份 damage 文件。画的时候在
  #   # ontology 树顶部选 "damage / no atlas counterpart" 分配给该 label 即可，
  #   # 导出的 sidecar 会记下 damage_labels，这里就【可以不写】（sidecar 自动
  #   # 读入，同 region_ids 的 fallback 逻辑；显式写的 atlas_ids/atlas_names/
  #   # ignore_labels 优先于 sidecar 的 damage 标记）。与 ignore_labels 的
  #   # 区别：ignore 是"当没画过"，damage 是"主动从 metric 里排除"。
  #   damage_labels: [9]
  #
  # 关键层间隔按结构选（实测 Dice：形状连续的大结构每 20 层够用，细长/弯曲的
  # 会崩）：cortex 每 20 层 0.82、cerebellum 每 20 层 0.90，但 corpus callosum
  # 每 20 层只有 0.40、dentate gyrus 0.36 —— 后两者要每 10 层。
  # 小于 1mm^3 的结构不建议用作引导：手圈的边界误差占比太大，而系统性偏大/
  # 偏小会主动把形变往错误方向拽，比不加引导更糟。
  #
  # 旧的一区一对文件写法仍然支持（图谱侧也手画，用于没有对应本体名字的区域）：
  # guide_regions:
  #   - atlas_outline_path: /path/to/atlas_side.nii.gz
  #     sample_outline_path: /path/to/sample_side.nii.gz
  #     weight: 1.0

  # 【可选】样本侧缺损 mask：标出样本里【组织根本不存在】的地方（清透过程中
  # 丢失的结构、撕裂），让 metric 别在那儿算分。约定是【非零 = 参与配准】，
  # 所以这张图应该是"整体全 1、只挖几个洞"。
  #
  # 别画成组织轮廓（tissue=1 / background=0）：那会把样本还没覆盖到的图谱区域
  # 全部移出目标函数，Affine 就不再放大样本了（实测缺失范围只找回 9%，而同一张
  # mask 只用在预对齐上是 101%，见 register.register_to_atlas 的 docstring）。
  # 覆盖率低于 80% 会打 warning。
  #
  # 用 Registration_toolkit/paint_mask.py（kind=mask）画。空腔往往跨几十层，
  # 建议在那份 config 里设 interpolate: true —— 改成画【要排除的区域】的
  # 稀疏关键帧、层间自动插值，不用一层层擦。
  # sample_damage_mask_path: /path/to/s12t_damage.nii.gz
  # # 画在原始 TIFF 上时必填（那份文件头里没有体素尺寸，读回来是 1,1,1），
  # # 顺序同 sample.voxel_size_um。给了就会自动重采样到配准网格；
  # # 不给、而且 shape 又对不上配准网格的话会直接报错，不会静默用错。
  # sample_damage_mask_voxel_size_um: [2.6, 2.6, 32.0]

  # potential mask for samples:

  # auto_brain_mask:
  #   sigma: 1.0
  #   closing_radius: 3
  #   dilate_radius: 2
  #   slice_axis: 2

  # guide_regions:
  #   - atlas_outline_path: /path/to/atlas_outline.nii.gz
  #     sample_outline_path: /path/to/sample_outline.nii.gz
  #     weight: 1.0

preprocess:
  n4_bias_correction: true              # 是否做 N4 偏场校正（光片照明不均匀，比如样本一侧比另一侧暗）
  intensity_clip_percentiles: [0.1, 99.9]   # 强度裁剪的百分位，按每张图自己的分布算，不受16-bit绝对亮暗影响

            
