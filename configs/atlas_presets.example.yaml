# 图谱预设：把每个图谱的 template/annotation/resolution/ontology/orientation 集中定义一次，
# 样本配置里 atlas.source 直接写预设名字就行（比如 devccf_p04），不用每个样本重复抄一遍
# 完整路径。复制这份改成 configs/atlas_presets_local.yaml（gitignored，放真实机器路径），
# 跟 mask_tools/paint_mask_local.yaml 是同一个约定。
#
# 用法（样本配置里）：
#   atlas:
#     source: devccf_p04   # 或 demba_p5 —— 预设名字，不再需要 template_path 等字段
# 样本配置里如果还额外写了 template_path/orientation 等字段，会覆盖预设里的同名字段
# （其余字段仍然用预设的），可以用来在某个样本上临时改一下裁剪范围之类的。
#
# 每个预设的字段跟 config.example.yaml 里 atlas.source: custom 时的字段完全一样：
# template_path / annotation_path / resolution_um（必填），ontology_path / orientation /
# slicing（可选）。
#
# ============ 怎么推 orientation（换了成像方位的新样本必看） ============
# orientation 描述的是"把图谱的轴转成跟【样本】的轴一致"，所以它同时取决于图谱和样本，
# 不是图谱自己的固有属性 —— 样本方位一变就要重推。步骤：
#
# 1. 写下【图谱原始文件】三个数组轴的解剖含义。nii 文件可以直接从 affine 读
#    （NIfTI 是 RAS+ 约定：世界 +X=Right, +Y=Anterior, +Z=Superior）：
#      python -c "import nibabel; print(nibabel.load('xxx.nii.gz').affine)"
#    affine 第 r 行里非零列 c 的含义是：世界第 r 轴 = ±spacing * 数组轴 c。
#    （各预设下面的注释里已经记好了各自的结果，不用每次重算。）
#
# 2. 写下【你的样本】三个数组轴的解剖含义。样本是 TIFF 栈时，本项目读进来固定是
#    (x, y, z) = (页内列, 页内行, 页号)，所以通常就是：
#      轴0 = 图像左→右, 轴1 = 图像上→下, 轴2 = 层号递增
#    再把每条翻译成解剖方向（左→右 / 前→后 / 上→下 ...）。
#
# 3. 逐个填目标轴：orientation 的第 d 项 = "样本轴 d 的方向，对应图谱的哪个源轴"，
#    源轴用 1/2/3 表示（1=图谱轴0, 2=图谱轴1, 3=图谱轴2），方向相反就加负号。
#
# 例（configs/s12t.yaml 的 tsc12t，DevCCF P04）：
#   样本轴0 = 左→右(Right)   ← 图谱轴0 就是 Right，同向        → +1
#   样本轴1 = 前→后(Post.)   ← 图谱轴2 是 Anterior，方向相反   → -3
#   样本轴2 = 上→下(Inf.)    ← 图谱轴1 就是 Inferior，同向     → +2
#   ⇒ orientation: [1, -3, 2]
#
# 4. 核对：跑一次快速 Affine（type_of_transform: Affine）看 warp 后的样本轮廓能不能
#    套上图谱，或者把转向后的图谱导成 TIFF 用 Fiji 跟原图逐层对照。注意左右对称的图谱
#    单独看是看不出 X 轴翻没翻的，必须跟样本对照。
#
# ============ 半球裁剪（slicing）============
# 样本只有半个脑时，图谱也要裁成同一侧再配准，否则 SyN 会去硬拉伸匹配不存在的另一半。
# slicing 格式 [[x1,x2]|null, [y1,y2]|null, [z1,z2]|null]，**在 orientation 之后生效**，
# 所以索引写的是"转向之后"网格上的坐标。半球是每个样本自己的属性，建议写在样本配置的
# atlas_variants.<预设名>.slicing 里（见 configs/s12t.yaml），不要写在这份共用预设里。

demba_p5:
  template_path: /path/to/DeMBA_p5/DeMBA_P5_reference_trimmed_1_3_2__285-510_full_full.tif
  annotation_path: /path/to/DeMBA_p5/DeMBA_P5_annotation_trimmed_1_3_2__285-510_full_full.tif
  resolution_um: 25
  ontology_path: /path/to/DeMBA_p5/CCF_v3_ontology.json

devccf_p04:
  template_path: /path/to/DevCCF/P04/P04_LSFM_20um.nii.gz
  annotation_path: /path/to/DevCCF/P04/P04_DevCCF_Annotations_20um.nii.gz
  resolution_um: 20
  ontology_path: /path/to/DevCCF/DevCCFv1_ontology.json   # 由 scripts/convert_devccf_ontology.py 生成

  # 【DevCCF P04 原始文件的方向】从 nii 的 affine（NIfTI RAS+ 约定）读出来：
  #   轴0 递增 → Right     (左→右)      形状 640
  #   轴1 递增 → Inferior  (上→下)      形状 560
  #   轴2 递增 → Anterior  (后→前)      形状 800
  # 中线（左右对称面）在轴0 的 320，右半球 = 转向后 X 的 [320, 640)。
  orientation: [1, -3, 2]   # 见下方「怎么推 orientation」；这个值对应"轴0=左→右, 轴1=前→后, 轴2=上→下"的样本
